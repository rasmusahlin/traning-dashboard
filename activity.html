<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pass – Träningsdashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <div class="container nav-inner">
    <span class="nav-brand">Träningsdashboard</span>
    <div class="nav-links">
      <a href="index.html">Översikt</a>
      <a href="analysis.html">Utveckling</a>
      <a href="plan/">Min plan</a>
      <a href="upload.html">Importera</a>
      <a href="settings.html">Mål & inställningar</a>
    </div>
  </div>
</nav>

<div class="container">
  <div style="padding-top:1.5rem">
    <a class="back-btn" onclick="history.back()">← Tillbaka</a>
  </div>

  <div id="main-content">
    <div class="empty" style="padding:4rem"><div class="empty-icon">◎</div>Laddar pass...</div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="js/db.js"></script>
<script src="js/profile.js"></script>
<script src="js/training.js"></script>
<script>
let charts = {};
let currentActivity = null;
const actId = new URLSearchParams(location.search).get('id');

async function init() {
  if (!/^[0-9a-f-]{36}$/i.test(actId || '')) { document.getElementById('main-content').innerHTML = '<div class="empty">Inget giltigt pass-ID angivet.</div>'; return; }
  try {
    await TrainingProfile.load();
    const [acts, laps, splits] = await Promise.all([
      dbQuery(`activities?id=eq.${actId}`),
      dbQueryAll(`laps?activity_id=eq.${actId}&order=lap_index.asc,id.asc`),
      dbQueryAll(`km_splits?activity_id=eq.${actId}&order=km.asc,id.asc`)
    ]);
    const act = acts?.[0];
    if (!act) { document.getElementById('main-content').innerHTML = '<div class="empty">Passet hittades inte.</div>'; return; }
    currentActivity = act;
    render(act, laps || [], splits || []);
    renderActivityTags(act);
  } catch(e) {
    document.getElementById('main-content').innerHTML = `<div class="empty">Fel: ${escapeHtml(e.message)}</div>`;
  }
}

function render(act, laps, splits) {
  const isRun = act.activity_type === 'running';
  const pace = fmtPace(Training.paceSeconds(act).seconds);
  const hrCfg = act.hr_zone_config || getHRConfig();

  document.getElementById('main-content').innerHTML = `
    <div class="page-header">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
        <div class="activity-dot ${typeDotClass(act.activity_type)}" style="width:40px;height:40px;font-size:12px">${typeDot(act.activity_type)}</div>
        <div>
          <h1 style="font-size:20px;font-weight:500">${typeLabel(act.activity_type)}</h1>
          <p style="font-size:14px;color:var(--text2)">${fmtDate(act.activity_date)}</p>
        </div>
      </div>
    </div>

    <!-- Summary metrics -->
    <div class="metrics" style="grid-template-columns:repeat(${isRun?5:3},1fr);margin-bottom:1.5rem">
      <div class="metric"><div class="metric-label">Distans</div><div class="metric-value">${act.distance_meters?(act.distance_meters/1000).toFixed(2):'-'}<span class="metric-unit"> km</span></div></div>
      <div class="metric"><div class="metric-label">Tid med aktiv timer</div><div class="metric-value" style="font-size:20px">${fmtDuration(act.moving_time_seconds || act.duration_seconds)}</div><div class="metric-sub">Totalt ${fmtDuration(act.duration_seconds)}${act.moving_time_seconds ? '' : ' · timer saknas'}</div></div>
      ${isRun ? `<div class="metric"><div class="metric-label">Tempo</div><div class="metric-value" style="font-size:20px">${pace}<span class="metric-unit">/km</span></div><div class="metric-sub">Aktiv timer i första hand</div></div>` : ''}
      ${act.avg_hr ? `<div class="metric"><div class="metric-label">Snittpuls</div><div class="metric-value">${act.avg_hr}<span class="metric-unit"> bpm</span></div><div class="metric-sub">max ${act.max_hr||'–'} bpm</div></div>` : ''}
      ${act.elevation_gain_meters ? `<div class="metric"><div class="metric-label">Höjdmeter</div><div class="metric-value">+${Math.round(act.elevation_gain_meters)}<span class="metric-unit"> m</span></div></div>` : ''}
    </div>

    <section class="card" id="activity-tags"></section>
    <!-- Tabs -->
    <div class="tabs">
      ${isRun ? '<button class="tab-btn active" onclick="switchTab(\'splits\',this)">Km-splits</button>' : ''}
      ${laps.length ? '<button class="tab-btn' + (isRun?'':' active') + '" onclick="switchTab(\'laps\',this)">Laps</button>' : ''}
      ${act.avg_hr ? '<button class="tab-btn" onclick="switchTab(\'zones\',this)">Pulszoner</button>' : ''}
      <button class="tab-btn" onclick="switchTab(\'charts\',this)">Grafer</button>
      <button class="tab-btn" onclick="switchTab(\'info\',this)">Info</button>
    </div>

    <!-- Km-splits tab -->
    ${isRun ? `
    <div id="tab-splits" class="tab-panel active">
      ${splits.length ? renderSplitsTable(splits) : '<div class="empty"><div class="empty-icon">◎</div>Km-splits saknas – dessa genereras när du laddar upp FIT-filen direkt</div>'}
    </div>` : ''}

    <!-- Laps tab -->
    ${laps.length ? `
    <div id="tab-laps" class="tab-panel${isRun?'':' active'}">
      ${renderLapsTable(laps, isRun)}
    </div>` : ''}

    <!-- HR zones tab -->
    ${act.avg_hr ? `
    <div id="tab-zones" class="tab-panel">
      <div class="card">
        <div class="card-header"><span class="card-title">Pulszonsfördelning</span><span style="font-size:12px;color:var(--text3)">Karvonen: vila ${hrCfg.rest} bpm · max ${hrCfg.max} bpm</span></div>
        <div id="zone-bars">Laddar...</div>
      </div>
    </div>` : ''}

    <!-- Charts tab -->
    <div id="tab-charts" class="tab-panel">
      <div class="card">
        <div class="card-header"><span class="card-title">Tempo och höjd</span></div>
        <div style="position:relative;height:220px"><canvas id="chart-pace-elev" role="img" aria-label="Tempo och höjd över tid">Laddar...</canvas></div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">Puls över tid</span></div>
        <div style="position:relative;height:180px"><canvas id="chart-hr-time" role="img" aria-label="Puls över tid">Laddar...</canvas></div>
      </div>
      ${isRun&&splits.length ? `
      <div class="card">
        <div class="card-header"><span class="card-title">Tempo per km</span></div>
        <div style="position:relative;height:180px"><canvas id="chart-splits" role="img" aria-label="Tempo per km">Laddar...</canvas></div>
      </div>` : ''}
    </div>

    <!-- Info tab -->
    <div id="tab-info" class="tab-panel">
      <div class="card">
        <div class="card-header"><span class="card-title">Passdetaljer</span></div>
        <table style="width:100%;font-size:14px;border-collapse:collapse">
          ${[
            ['Datum', fmtDate(act.activity_date)],
            ['Typ', typeLabel(act.activity_type)],
            ['Distans', act.distance_meters ? (act.distance_meters/1000).toFixed(3)+' km' : '–'],
            ['Total tid', fmtDuration(act.duration_seconds)],
            ['Tid med aktiv timer', fmtDuration(act.moving_time_seconds)],
            ['Snittempo', isRun ? pace+'/km' : '–'],
            ['Snittpuls', act.avg_hr ? act.avg_hr+' bpm' : '–'],
            ['Maxpuls', act.max_hr ? act.max_hr+' bpm' : '–'],
            ['Snitt kadens', act.avg_cadence ? act.avg_cadence+' spm' : '–'],
            ['Höjdmeter upp', act.elevation_gain_meters ? '+'+Math.round(act.elevation_gain_meters)+' m' : '–'],
            ['Höjdmeter ned', act.elevation_loss_meters ? '-'+Math.round(act.elevation_loss_meters)+' m' : '–'],
            ['Kalorier', act.calories ? act.calories+' kcal' : '–'],
            ['Källa', act.filename || 'Manuell inmatning'],
            ['Notat', act.notes || '–']
          ].map(([k,v])=>`<tr><td style="padding:8px 0;color:var(--text2);width:40%;border-bottom:0.5px solid var(--border)">${escapeHtml(k)}</td><td style="padding:8px 0;border-bottom:0.5px solid var(--border)">${escapeHtml(String(v))}</td></tr>`).join('')}
        </table>
      </div>
    </div>
  `;

  // Render zone bars if HR data exists
  if (act.avg_hr) renderZoneBars(act);

  // Load time series for charts
  loadTimeSeries(act.id, splits);
}

function renderSplitsTable(splits) {
  const paces = splits.map(s => s.pace_sec_per_km).filter(Boolean);
  const minPace = Math.min(...paces);
  const maxPace = Math.max(...paces);
  const paceRange = maxPace - minPace || 1;

  return `<div class="card" style="overflow-x:auto">
    <table class="splits-table">
      <thead><tr>
        <th>Km</th><th>Tempo</th><th style="min-width:120px">Visualisering</th>
        <th>Puls</th><th>Zon</th><th>Kadens</th><th>Distans</th>
      </tr></thead>
      <tbody>
        ${splits.map(s => {
          const z = s.avg_hr ? hrZone(s.avg_hr) : null;
          const barPct = s.pace_sec_per_km ? Math.round(((maxPace - s.pace_sec_per_km) / paceRange) * 100) : 0;
          const partial = s.partial ? `<span style="font-size:10px;color:var(--text3)"> (del)</span>` : '';
          return `<tr>
            <td><strong>${s.km}</strong>${partial}</td>
            <td><strong>${fmtPace(s.pace_sec_per_km)}</strong>/km</td>
            <td><div class="pace-bar"><div class="pace-bar-fill" style="width:${barPct}%"></div></div></td>
            <td>${s.avg_hr ? s.avg_hr+' bpm' : '–'}</td>
            <td>${z ? `<span class="zone-badge z${z.num}">Z${z.num}</span>` : '–'}</td>
            <td>${s.avg_cadence ? s.avg_cadence+' spm' : '–'}</td>
            <td style="color:var(--text2)">${(s.distance_meters/1000).toFixed(3)} km</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

function renderLapsTable(laps, isRun) {
  return `<div class="card" style="overflow-x:auto">
    <table class="splits-table">
      <thead><tr>
        <th>Varv</th><th>Distans</th><th>Timer / totalt</th>
        ${isRun ? '<th>Tempo</th>' : ''}
        <th>Puls</th><th>Zon</th><th>Kadens</th>
      </tr></thead>
      <tbody>
        ${laps.map(l => {
          const z = l.avg_hr ? hrZone(l.avg_hr) : null;
          return `<tr>
            <td><strong>${l.lap_index}</strong></td>
            <td>${(l.distance_meters/1000).toFixed(3)} km</td>
            <td>${l.moving_duration_seconds ? fmtDuration(l.moving_duration_seconds) : '–'} / ${fmtDuration(l.duration_seconds)}</td>
            ${isRun ? `<td><strong>${fmtPace(l.avg_pace_sec_per_km)}</strong>/km</td>` : ''}
            <td>${l.avg_hr ? l.avg_hr+' bpm' : '–'}</td>
            <td>${z ? `<span class="zone-badge z${z.num}">Z${z.num}</span>` : '–'}</td>
            <td>${l.avg_cadence ? l.avg_cadence+' spm' : '–'}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

function renderActivityTags(act) {
  const tag = TrainingProfile.get().activityTags[act.id] || {};
  const option = (value, label, selected) => `<option value="${value}" ${value === selected ? 'selected' : ''}>${label}</option>`;
  document.getElementById('activity-tags').innerHTML = `
    <h2 class="card-title">Gör passet lättare att jämföra</h2>
    <p class="muted">Valfritt. Test och tävling använder totaltiden när resultatet jämförs med ditt mål.</p>
    <form id="tag-form" class="form-grid">
      <label>Passets syfte<select id="tag-kind">${[['other','Ej markerat'],['easy','Lugn distans'],['test','Testlopp'],['race','Tävling']].map(([v,l]) => option(v,l,tag.kind || 'other')).join('')}</select></label>
      <label>Underlag<select id="tag-surface">${[['unknown','Inte angivet'],['road','Väg / bana'],['trail','Terräng'],['treadmill','Löpband']].map(([v,l]) => option(v,l,tag.surface || 'unknown')).join('')}</select></label>
      <label>Jämförelserunda<input id="tag-route" maxlength="80" placeholder="Till exempel min flacka runda" value="${escapeHtml(tag.route || '')}"></label>
      <label>Aktivitetstyp<select id="activity-type-edit">${[['running','Löpning'],['strength','Styrketräning'],['hiking','Vandring'],['cycling','Cykling'],['swimming','Simning'],['unknown','Annan aktivitet']].map(([v,l]) => option(v,l,act.activity_type)).join('')}</select></label>
      ${act.activity_type === 'strength' ? `<fieldset class="full-width"><legend>Styrkeutveckling (valfritt)</legend><p class="muted">Registrera ett jämförbart arbetsset i en övning. Samma övning, belastning och repetitioner kan följas på startsidan.</p><div class="form-grid"><label>Övning<input id="strength-exercise" maxlength="80" value="${escapeHtml(tag.strength?.exercise || '')}"></label><label>Belastning (kg)<input id="strength-weight" type="number" min="0" max="1000" step="0.5" value="${escapeHtml(String(tag.strength?.weightKg ?? ''))}"></label><label>Repetitioner<input id="strength-reps" type="number" min="1" max="200" value="${escapeHtml(String(tag.strength?.reps ?? ''))}"></label></div></fieldset>` : ''}
      <div class="full-width"><button class="btn" type="submit">Spara passuppgifter</button> <span id="tag-status" role="status" class="muted"></span></div>
    </form>`;
  document.getElementById('tag-form').addEventListener('submit', async event => {
    event.preventDefault();
    const message = document.getElementById('tag-status');
    try {
      const next = { ...tag, kind: document.getElementById('tag-kind').value, surface: document.getElementById('tag-surface').value, route: document.getElementById('tag-route').value.trim() };
      if (document.getElementById('strength-exercise')) {
        const exercise = document.getElementById('strength-exercise').value.trim();
        const weight = document.getElementById('strength-weight').value;
        const reps = document.getElementById('strength-reps').value;
        if (exercise && (weight === '' || reps === '')) throw new Error('Ange både belastning och repetitioner för arbetssetet.');
        next.strength = exercise ? { exercise, weightKg: Number(weight), reps: Number(reps) } : null;
      }
      const type = document.getElementById('activity-type-edit').value;
      if (type !== act.activity_type) {
        await dbQuery(`activities?id=eq.${encodeURIComponent(act.id)}`, { method: 'PATCH', body: JSON.stringify({ activity_type: type }) });
        act.activity_type = type;
      }
      const result = await TrainingProfile.save({ activityTags: { [act.id]: next } });
      message.textContent = result.status + ' Öppna passet igen om du ändrade aktivitetstyp.';
    } catch (error) { message.textContent = error.message; }
  });
}

function renderZoneBars(act) {
  const el = document.getElementById('zone-bars');
  if (!el) return;
  const snapshot = act.hr_zone_config;
  const recorded = act.hr_zone_seconds;
  const { zones, max } = snapshot?.zones?.length ? snapshot : getHRConfig();
  const total = recorded ? Object.values(recorded).reduce((s,v) => s + (Number(v) || 0), 0) : 0;
  if (!total) {
    el.innerHTML = `<p class="muted">Exakt zonfördelning är inte sparad för det här passet. Snittpulsen ${act.avg_hr ? escValue(act.avg_hr) + ' bpm' : 'saknas'} räcker inte för att visa hur länge du tränade i varje zon.</p><p class="muted">Nya importer beräknar zonminuter från originalfilens tidsstämplade puls. Äldre filer kan importeras igen för att komplettera underlaget.</p>`;
    return;
  }
  el.innerHTML = zones.map(z => {
    const seconds = Number(recorded[String(z.num)]) || 0;
    const pct = seconds / total * 100;
    return `<div class="zone-row">
      <div class="zone-label"><span class="zone-badge z${z.num}">Z${z.num}</span></div>
      <div style="flex:1">
        <div style="font-size:12px;color:var(--text2);margin-bottom:3px">${escapeHtml(z.name)} · ${Math.round(z.min)}–${z.max == null || z.max === Infinity ? max : Math.round(z.max)} bpm</div>
        <div class="zone-bar-wrap"><div class="zone-bar-inner" style="width:${pct}%;background:var(--z${z.num}t)"></div></div>
      </div>
      <span style="font-size:12px;color:var(--text2)">${Math.round(seconds / 60)} min · ${Math.round(pct)}%</span>
    </div>`;
  }).join('') + `<p class="muted">${Math.round(total / 60)} minuter med täckt pulsunderlag av ${Math.round((act.moving_time_seconds || act.duration_seconds) / 60)} timerminuter. Luckor och pauser räknas inte som mätt zonstid. Gränserna sparades vid import: vilopuls ${snapshot?.rest ?? '–'}, maxpuls ${snapshot?.max ?? '–'} bpm.</p>`;
}
function escValue(value) { return escapeHtml(String(value)); }

async function loadTimeSeries(actId, splits) {
  try {
    const ts = await dbQueryAll(`time_series?activity_id=eq.${actId}&order=t.asc,id.asc`);
    if (ts && ts.length) renderTimeSeriesCharts(ts, splits);
  } catch(e) { console.log('No time series data', e); }
}

function renderTimeSeriesCharts(ts, splits) {
  Object.values(charts).forEach(c => c.destroy());
  charts = {};

  const labels = ts.map(p => fmtDuration(p.t));
  const alt = ts.map(p => p.alt).filter(Boolean);
  const hasAlt = alt.length > ts.length * 0.5;
  const hasSpeed = ts.some(p => p.speed);
  const hasHR = ts.some(p => p.hr);

  // Pace + elevation chart
  const paceElev = document.getElementById('chart-pace-elev');
  if (paceElev) {
    const datasets = [];
    if (hasSpeed) datasets.push({
      label: 'Pace (sek/km)',
      data: ts.map(p => p.speed ? +(1000/p.speed).toFixed(1) : null),
      borderColor: '#1d9e75', backgroundColor: 'rgba(29,158,117,0.07)',
      yAxisID: 'yPace', tension: 0.2, pointRadius: 0, fill: true, spanGaps: true
    });
    if (hasAlt) datasets.push({
      label: 'Elevation (m)',
      data: ts.map(p => p.alt ? +p.alt.toFixed(1) : null),
      borderColor: '#ba7517', backgroundColor: 'rgba(186,117,23,0.15)',
      yAxisID: 'yAlt', tension: 0.3, pointRadius: 0, fill: true, spanGaps: true
    });
    if (datasets.length) {
      charts.paceElev = new Chart(paceElev, {
        type: 'line',
        data: { labels, datasets },
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid:{display:false}, ticks:{font:{size:10},maxTicksLimit:8} },
            yPace: { position:'left', reverse:true, grid:{color:'rgba(128,128,128,0.08)'}, ticks:{font:{size:10},callback:v=>fmtPace(v)} },
            yAlt: { position:'right', grid:{display:false}, ticks:{font:{size:10}} }
          }
        }
      });
    }
  }

  // HR over time
  const hrTime = document.getElementById('chart-hr-time');
  if (hrTime && hasHR) {
    const { zones } = getHRConfig();
    charts.hrTime = new Chart(hrTime, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: 'HR',
          data: ts.map(p => p.hr || null),
          borderColor: '#d85a30', backgroundColor: 'rgba(216,90,48,0.08)',
          tension: 0.2, pointRadius: 0, fill: true, spanGaps: true
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        plugins: { legend:{display:false}, annotation:{} },
        scales: {
          x: { grid:{display:false}, ticks:{font:{size:10},maxTicksLimit:8} },
          y: { grid:{color:'rgba(128,128,128,0.08)'}, ticks:{font:{size:10}} }
        }
      }
    });
  }

  // Splits bar chart
  const splitsChart = document.getElementById('chart-splits');
  if (splitsChart && splits.length) {
    charts.splits = new Chart(splitsChart, {
      type: 'bar',
      data: {
        labels: splits.map(s => `${s.km} km`),
        datasets: [{
          label: 'Pace',
          data: splits.map(s => s.pace_sec_per_km ? +s.pace_sec_per_km.toFixed(1) : null),
          backgroundColor: splits.map(s => {
            if (!s.avg_hr) return '#185FA5';
            const z = hrZone(s.avg_hr);
            return z.color;
          }),
          borderRadius: 4
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend:{display:false}, tooltip:{callbacks:{label:v=>`${fmtPace(v.raw)}/km`}} },
        scales: {
          y: { reverse:true, grid:{color:'rgba(128,128,128,0.08)'}, ticks:{font:{size:11},callback:v=>fmtPace(v)} },
          x: { grid:{display:false}, ticks:{font:{size:11}} }
        }
      }
    });
  }
}

function switchTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  const panel = document.getElementById('tab-' + name);
  if (panel) panel.classList.add('active');
}

startApp(init);
</script>
</body>
</html>
